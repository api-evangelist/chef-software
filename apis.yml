aid: chef-software
name: Chef Software
description: >-
  Chef Software is the DevOps automation company behind Chef Infra, Chef InSpec,
  Chef Habitat, and Chef Automate, now part of Progress Software. Chef pioneered
  infrastructure-as-code, letting teams define, deploy, and continuously enforce
  the configuration, compliance, and security posture of servers and applications
  across data centers and cloud at any scale. Chef Automate exposes a REST API
  (generated from gRPC service definitions via grpc-gateway) for managing
  compliance reporting, node management, configuration management, secrets, data
  feeds, event feeds, IAM (users, teams, tokens, policies, rules), and the
  application service catalog. Authentication is via API tokens presented in the
  api-token HTTP header. Chef also ships a deep open-source ecosystem of Ruby
  client tooling (chef-client, InSpec, Ohai, Berkshelf, chef-cli, knife)
  distributed on RubyGems, all developed in the open on the chef GitHub org.
