        in: path
        required: true
        schema:
          type: string
      tags:
      - DatafeedService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chef.automate.api.datafeed.UpdateDestinationEnableRequest'
        required: true
      summary: Datafeed service enable destination
      x-summary-source: derived
