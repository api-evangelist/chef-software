  /api/v0/eventexport:
    get:
      operationId: EventFeedService_EventExport
      responses:
        '200':
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/chef.automate.api.event_feed.response.EventExportResponse'
                  error:
                    $ref: '#/components/schemas/grpc.gateway.runtime.StreamError'
                title: Stream result of chef.automate.api.event_feed.response.EventExportResponse
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      parameters:
      - name: output_type
        description: JSON or CSV.
        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: Filters to be applied to the request.
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: start
        description: Earliest events to return.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: end
        description: Latest events to return.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: order
        description: Order the results should be returned in.
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
          default: ASC
      tags:
      - hidden
      summary: Event feed service event export
      x-summary-source: derived
